name: Validate results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate results against results_v4 schemas
        run: python scripts/validate_results.py

  # Open or update a PR in the website repo that bumps its `data/results` submodule
  preview:
    needs: validate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Open/update the website preview PR
        env:
          GH_TOKEN: ${{ secrets.OP_BOT_TOKEN }}
          WEBSITE: openproblems-bio/website-v3
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::OP_BOT_TOKEN secret is not set; skipping the website preview PR."
            exit 0
          fi
          BRANCH="bot/results-pr-${PR}"

          git config --global user.name  "openproblems-bot"
          git config --global user.email "bot@openproblems.bio"

          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${WEBSITE}" site
          cd site
          git checkout -B "$BRANCH" origin/main

          # Point data/results at this PR's head commit.
          git submodule sync data/results
          git submodule update --init data/results
          git -C data/results fetch --quiet origin "$HEAD_SHA"
          git -C data/results checkout --quiet "$HEAD_SHA"
          git add data/results

          if git diff --cached --quiet; then
            echo "data/results already at ${HEAD_SHA}; nothing to update."
          else
            git commit --quiet -m "preview: results#${PR} (data/results @ ${HEAD_SHA:0:7})"
          fi
          git push --force --quiet origin "$BRANCH"

          # Carry this PR's title over so the website PR says what it is previewing.
          TITLE="Preview: results#${PR} - ${PR_TITLE}"
          BODY="$(printf 'Automated preview build for [openproblems-bio/results#%s](%s): %s\n\nBumps the `data/results` submodule to the head of that PR. **Do not merge**, this is a throwaway preview branch.\n' \
            "$PR" "https://github.com/openproblems-bio/results/pull/${PR}" "$PR_TITLE")"

          # The force-push already refreshed any existing preview PR's contents, but the
          # title and body still have to be re-applied in case this PR was renamed.
          NUM="$(gh pr list -R "$WEBSITE" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$NUM" ]; then
            gh pr edit -R "$WEBSITE" "$NUM" --title "$TITLE" --body "$BODY" >/dev/null
            echo "Refreshed website preview PR ${WEBSITE}#${NUM} for $BRANCH."
          else
            gh pr create -R "$WEBSITE" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "Opened website preview PR for $BRANCH."
          fi
